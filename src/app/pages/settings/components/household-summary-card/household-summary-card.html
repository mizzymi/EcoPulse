<div class="relative overflow-hidden rounded-3xl border border-slate-200 bg-white p-6">
  <div
    class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-emerald-200/40 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute right-8 top-10 h-56 w-56 rounded-full bg-cyan-200/30 blur-3xl"
  ></div>

  <div class="relative flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-xs text-slate-500">
        <span class="rounded-full bg-emerald-100 px-2 py-1 text-emerald-700" i18n>
          Shared account
        </span>
        <span class="uppercase" *ngIf="household() as h" i18n="@@settings_currency_label">
          {{ h.currency }}
        </span>
      </div>

      <h1
        class="mt-2 text-2xl sm:text-3xl font-semibold text-slate-900 truncate"
        i18n="@@settings_household_title"
      >
        {{ household()?.name || '—' }}
      </h1>

      <div class="mt-2 flex items-end gap-2">
        <div class="text-4xl sm:text-5xl font-semibold text-slate-900 tabular-nums">
          {{ displayBalance() | currency: household()?.currency ?? 'EUR' : 'symbol' : '1.0-2' }}
        </div>
      </div>
    </div>

    <div class="flex flex-col items-end gap-2">
      <app-members-avatars />

      <div class="text-right text-xs text-slate-500">
        <div class="uppercase tracking-wide" i18n="@@settings_created_label">Created</div>
        <div class="font-medium text-slate-700" *ngIf="household() as h">
          <span i18n="@@settings_created_unknown" *ngIf="!h.joinedAt">Unknown</span>
          <span *ngIf="h.joinedAt">{{ h.joinedAt | date: 'MMM y' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
