<ng-container *ngIf="open()">
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-[1000] bg-black/30 backdrop-blur-[2px]"
    (click)="onBackdrop()"
    aria-hidden="true"
  ></div>

  <!-- Dialog wrapper -->
  <div
    class="fixed z-[1001] flex justify-center p-4 overflow-auto"
    [ngClass]="
      isSmall() ? 'top-0 left-0 right-0 max-h-screen items-start pt-6 pb-6' : 'inset-0 items-center'
    "
  >
    <!-- Dialog -->
    <div
      class="w-full max-w-3xl rounded-3xl bg-white shadow-xl border border-slate-100 overflow-hidden"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-label="Planned/Recurring dialog"
      i18n-aria-label="@@recurrent.modal.ariaLabel"
    >
      <div class="p-6 sm:p-8">
        <!-- Header row -->
        <div class="flex items-start justify-between">
          <div>
            <!-- Title -->
            <div class="text-xl sm:text-2xl font-black text-slate-900">
              @if (mode() === 'EDIT') {
                <span i18n="@@recurrent.modal.title.edit">Edit</span>
              } @else {
                <span i18n="@@recurrent.modal.title.new">New</span>
              }
              <span class="ml-2">
                @if (targetUi() === 'PLANNED') {
                  <span i18n="@@recurrent.modal.kind.planned">Planned</span>
                } @else {
                  <span i18n="@@recurrent.modal.kind.recurring">Recurring</span>
                }
              </span>
            </div>

            <!-- targetUi() toggle -->
            <div class="mt-3 inline-flex rounded-2xl bg-slate-50 p-1 border border-slate-100">
              <button
                type="button"
                class="px-4 py-2 rounded-2xl text-sm font-extrabold transition"
                [class.bg-slate-900]="targetUi() === 'PLANNED'"
                [class.text-white]="targetUi() === 'PLANNED'"
                [class.text-slate-600]="targetUi() !== 'PLANNED'"
                (click)="setTarget('PLANNED')"
                i18n="@@recurrent.modal.tab.planned"
              >
                Planned
              </button>

              <button
                type="button"
                class="px-4 py-2 rounded-2xl text-sm font-extrabold transition"
                [class.bg-slate-900]="targetUi() === 'RECURRING'"
                [class.text-white]="targetUi() === 'RECURRING'"
                [class.text-slate-600]="targetUi() !== 'RECURRING'"
                (click)="setTarget('RECURRING')"
                i18n="@@recurrent.modal.tab.recurring"
              >
                Recurring
              </button>
            </div>

            <!-- Type toggle -->
            <div
              class="mt-6 text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
              i18n="@@recurrent.modal.typeLabel"
            >
              Type
            </div>

            <div class="mt-3 inline-flex rounded-2xl bg-slate-50 p-1 border border-slate-100">
              <button
                type="button"
                class="px-4 py-2 rounded-2xl text-sm font-extrabold flex items-center gap-2 transition"
                [class.bg-rose-500]="type() === 'EXPENSE'"
                [class.text-white]="type() === 'EXPENSE'"
                [class.text-slate-600]="type() !== 'EXPENSE'"
                (click)="setType('EXPENSE')"
              >
                <span i18n="@@recurrent.types.expense">Expense</span>
              </button>

              <button
                type="button"
                class="px-4 py-2 rounded-2xl text-sm font-extrabold flex items-center gap-2 transition"
                [class.bg-slate-900]="type() === 'INCOME'"
                [class.text-white]="type() === 'INCOME'"
                [class.text-slate-600]="type() !== 'INCOME'"
                (click)="setType('INCOME')"
              >
                <span i18n="@@recurrent.types.income">Income</span>
              </button>
            </div>
          </div>

          <button
            type="button"
            class="rounded-2xl p-2 hover:bg-slate-50 text-slate-500"
            (click)="close.emit()"
            aria-label="Close"
            i18n-aria-label="@@recurrent.modal.close"
          >
            ✕
          </button>
        </div>

        <!-- Body -->
        @if (targetUi() === 'PLANNED') {
          <!-- Planned -->
          <form class="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-4" [formGroup]="plannedForm">
            <label class="flex flex-col gap-1">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.amount"
                >Amount</span
              >
              <input
                type="number"
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="amount"
                (input)="onNumberInput('planned', 'amount', $any($event.target).valueAsNumber)"
              />
            </label>

            <label class="flex flex-col gap-1">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.dueDate"
                >Due date</span
              >
              <input
                type="date"
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="dueDate"
              />
            </label>
            <label class="flex flex-col gap-1 sm:col-span-2">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.concept"
                >Concept</span
              >
              <input
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="concept"
              />
            </label>
            <label class="flex flex-col gap-1">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.category"
                >Category</span
              >
              <input
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="category"
              />
            </label>

            <label class="flex flex-col gap-1 sm:col-span-2">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.notes"
                >Notes</span
              >
              <textarea
                rows="2"
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="notes"
              ></textarea>
            </label>
          </form>
        } @else {
          <!-- Recurring -->
          <form class="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-4" [formGroup]="recurringForm">
            <label class="flex flex-col gap-1">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.amount"
                >Amount</span
              >
              <input
                type="number"
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="amount"
                (input)="onNumberInput('recurring', 'amount', $any($event.target).valueAsNumber)"
              />
            </label>
            <div class="flex flex-col gap-2">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.recurring.schedule"
                >Schedule</span
              >

              <div class="inline-flex rounded-2xl bg-slate-50 p-1 border border-slate-100 w-fit">
                <button
                  type="button"
                  class="px-3 py-2 rounded-2xl text-xs font-extrabold transition"
                  [class.bg-slate-900]="scheduleMode() === 'DAY_OF_MONTH'"
                  [class.text-white]="scheduleMode() === 'DAY_OF_MONTH'"
                  [class.text-slate-600]="scheduleMode() !== 'DAY_OF_MONTH'"
                  (click)="applyScheduleMode('DAY_OF_MONTH')"
                  i18n="@@recurrent.recurring.schedule.dayOfMonth"
                >
                  Day
                </button>

                <button
                  type="button"
                  class="px-3 py-2 rounded-2xl text-xs font-extrabold transition"
                  [class.bg-slate-900]="scheduleMode() === 'RRULE'"
                  [class.text-white]="scheduleMode() === 'RRULE'"
                  [class.text-slate-600]="scheduleMode() !== 'RRULE'"
                  (click)="applyScheduleMode('RRULE')"
                  i18n="@@recurrent.recurring.schedule.rrule"
                >
                  RRULE
                </button>
              </div>
            </div>
            <label class="flex flex-col gap-1 sm:col-span-2">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.concept"
                >Concept</span
              >
              <input
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="concept"
              />
            </label>

            @if (scheduleMode() === 'DAY_OF_MONTH') {
              <label class="flex flex-col gap-1">
                <span
                  class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                  i18n="@@recurrent.recurring.dayOfMonthLabel"
                  >Day of month</span
                >
                <input
                  type="number"
                  min="1"
                  max="31"
                  class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                  formControlName="dayOfMonth"
                  (input)="
                    onNumberInput('recurring', 'dayOfMonth', $any($event.target).valueAsNumber)
                  "
                />
              </label>
            } @else {
              <label class="flex flex-col gap-1">
                <span
                  class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                  i18n="@@recurrent.recurring.rruleLabel"
                  >RRULE</span
                >
                <input
                  class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                  formControlName="rrule"
                  placeholder="FREQ=MONTHLY;INTERVAL=1"
                  i18n-placeholder="@@recurrent.recurring.rrulePlaceholder"
                />
              </label>
            }

            <label class="flex flex-col gap-1">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.category"
                >Category</span
              >
              <input
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="category"
              />
            </label>

            <label class="flex flex-col gap-1 sm:col-span-2">
              <span
                class="text-[11px] font-extrabold tracking-wide text-slate-500 uppercase"
                i18n="@@recurrent.fields.notes"
                >Notes</span
              >
              <textarea
                rows="2"
                class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900 outline-none focus:ring-2 focus:ring-teal-200"
                formControlName="notes"
              ></textarea>
            </label>
          </form>
        }

        <!-- Footer -->
        <div class="mt-8 flex items-center justify-end gap-3">
          <button
            type="button"
            class="rounded-2xl px-5 py-3 text-sm font-extrabold text-slate-600 hover:bg-slate-50"
            (click)="close.emit()"
            i18n="@@recurrent.modal.cancel"
          >
            Cancel
          </button>

          <button
            type="button"
            class="rounded-2xl px-5 py-3 text-sm font-extrabold text-white bg-teal-600 hover:bg-teal-700 disabled:opacity-50 disabled:hover:bg-teal-600"
            [disabled]="saving() || !canSave()"
            (click)="submit()"
          >
            @if (mode() === 'EDIT') {
              <span i18n="@@recurrent.modal.save.update">Update</span>
            } @else {
              <span i18n="@@recurrent.modal.save.save">Save</span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
