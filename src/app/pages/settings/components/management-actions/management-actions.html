<div class="rounded-3xl border border-slate-200 bg-white p-4">
  <div class="text-sm font-semibold text-slate-900" i18n="@@settings_management_actions_title">
    Management Actions
  </div>

  <div class="mt-3 flex flex-col gap-3">
    <button
      type="button"
      class="group w-full rounded-2xl border border-slate-200 bg-white p-4 text-left hover:bg-slate-50 transition"
      (click)="onInvite()"
    >
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium text-slate-900" i18n="@@settings_invite_member">
            Invite Member
          </div>
          <div class="text-xs text-slate-500" i18n="@@settings_invite_member_desc">
            Share link or code
          </div>
        </div>
        <div class="text-slate-400 group-hover:text-slate-600">→</div>
      </div>
    </button>

    <button
      type="button"
      class="group w-full rounded-2xl border border-slate-200 bg-white p-4 text-left hover:bg-slate-50 transition"
      (click)="onSeeMembers()"
    >
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium text-slate-900" i18n="@@settings_see_members">See Members</div>
          <div class="text-xs text-slate-500" i18n="@@settings_see_members_desc">
            Manage access &amp; roles
          </div>
        </div>
        <div class="text-slate-400 group-hover:text-slate-600">→</div>
      </div>
    </button>

    <button
      type="button"
      class="group w-full rounded-2xl border border-purple-800 bg-purple-500 p-4 text-left hover:bg-purple-700 text-white transition"
      (click)="logOut()"
    >
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium" i18n="@@settings_log_out">Log Out</div>
        </div>
      </div>
    </button>
  </div>

  <div class="mt-6">
    <button
      type="button"
      class="w-full rounded-2xl border px-4 py-3 text-sm font-semibold transition"
      [class.border-rose-200]="canDelete()"
      [class.text-rose-700]="canDelete()"
      [class.hover:bg-rose-50]="canDelete()"
      [class.border-slate-200]="!canDelete()"
      [class.text-slate-400]="!canDelete()"
      [disabled]="!canDelete() || data.state() === 'loading'"
      (click)="onDelete()"
      i18n="@@settings_delete_account"
    >
      Delete Account
    </button>
    <div class="mt-2 text-[11px] text-slate-400" i18n="@@settings_delete_account_hint">
      This action cannot be undone. Owner only.
    </div>
  </div>
</div>
