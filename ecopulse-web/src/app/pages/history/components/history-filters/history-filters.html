<div class="px-5 py-4 border-b border-slate-100">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between min-w-0">
    <div class="flex items-center gap-3 min-w-0 w-full">
      <div class="flex-1 min-w-0">
        <input
          #searchInput
          type="text"
          placeholder="Search transactions..."
          i18n-placeholder="@@tx.filters.searchPlaceholder"
          class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-200"
          [value]="q"
          (input)="onInput(searchInput.value)"
          aria-label="Search transactions"
          i18n-aria-label="@@tx.filters.searchAria"
        />
      </div>

      <button
        type="button"
        class="rounded-xl border border-slate-200 bg-white hover:bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-800"
        (click)="clearCategory()"
        i18n="@@tx.filters.category"
      >
        Category
      </button>

      <button
        type="button"
        class="rounded-xl border border-slate-200 bg-white hover:bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-800"
        (click)="clearType()"
        i18n="@@tx.filters.type"
      >
        Type
      </button>
    </div>
  </div>
</div>
