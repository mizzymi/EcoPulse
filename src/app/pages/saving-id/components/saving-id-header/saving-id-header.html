<div class="flex items-start justify-between gap-3">
  <div class="min-w-0">
    <div class="text-lg font-semibold text-slate-900 truncate" i18n="@@savingId.title">
      Goal Details
    </div>
    <div class="text-sm text-slate-500 truncate">
      {{ goalName || '—' }}
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      class="text-sm font-medium text-slate-700 hover:text-slate-900 px-3 py-2 rounded-xl hover:bg-white/80 border border-slate-100"
      (click)="refresh.emit()"
      [disabled]="busy"
      aria-label="Refresh"
      i18n-aria-label="@@savings.refreshAria2"
      i18n="@@savings.refreshBtn"
    >
      <span class="text-base leading-none" aria-hidden="true">↻</span>
      <span class="ml-2">Refresh</span>
    </button>
  </div>
</div>
