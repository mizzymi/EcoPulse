<div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between w-full">
  <div class="min-w-0">
    <h1 class="text-xl sm:text-2xl font-semibold text-slate-900" i18n="@@charts.title">
      Financial Analytics
    </h1>

    <p class="text-sm text-slate-500" i18n="@@charts.subtitle">
      Track your spending habits and trends
    </p>

    <div class="mt-4 flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold tracking-wide text-slate-500" i18n="@@charts.breakdownBy">
        BREAKDOWN BY:
      </span>

      <button
        *ngFor="let opt of breakdownOptions"
        type="button"
        (click)="setBreakdown(opt.key)"
        class="px-3 py-1.5 text-xs rounded-full border transition hover:bg-white/60"
        [class.bg-white]="breakdown === opt.key"
        [class.border-teal-200]="breakdown === opt.key"
        [class.text-teal-700]="breakdown === opt.key"
        [class.border-slate-200]="breakdown !== opt.key"
        [class.text-slate-700]="breakdown !== opt.key"
      >
        {{ opt.label }}
      </button>
    </div>
  </div>

  <div class="flex flex-col items-stretch gap-3 lg:items-end">
    <div class="flex flex-wrap items-center gap-2 justify-start lg:justify-end">
      <!-- Period segmented -->
      <div class="inline-flex rounded-xl border border-slate-200 bg-white/60 p-1 shadow-sm">
        <button
          *ngFor="let opt of periodOptions"
          type="button"
          (click)="setPeriod(opt.key)"
          class="px-3 py-1.5 text-xs rounded-lg transition"
          [class.bg-teal-600]="period === opt.key"
          [class.text-white]="period === opt.key"
          [class.text-slate-600]="period !== opt.key"
        >
          {{ opt.label }}
        </button>
      </div>

      <!-- Optional account selector -->
      <ng-container *ngIf="account && accountOptions?.length">
        <select
          class="h-9 rounded-xl border border-slate-200 bg-white/60 px-3 text-xs text-slate-700 shadow-sm outline-none"
          [value]="account"
          (change)="setAccount($any($event.target).value)"
          aria-label="Account"
          i18n-aria-label="@@charts.accountAria"
        >
          <option *ngFor="let opt of accountOptions" [value]="opt.key">
            {{ opt.label }}
          </option>
        </select>
      </ng-container>
    </div>

    <!-- ✅ Custom date picker -->
    <div *ngIf="period === 'custom'" class="relative self-end">
      <button
        type="button"
        class="h-9 px-3 rounded-xl border border-slate-200 bg-white/60 text-xs text-slate-700 shadow-sm hover:bg-white transition"
        (click)="togglePicker()"
        i18n="@@charts.customRange.button"
      >
        Select dates
      </button>

      <div
        *ngIf="pickerOpen"
        class="absolute right-0 mt-2 w-[320px] rounded-2xl border border-slate-200 bg-white shadow-lg p-4 z-50"
      >
        <div class="text-xs font-semibold text-slate-700" i18n="@@charts.customRange.title">
          Custom range
        </div>

        <div class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1" i18n="@@charts.customRange.from">
              From
            </label>
            <input
              type="date"
              class="h-9 w-full rounded-xl border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none"
              [value]="from ?? ''"
              (change)="onFromChange($any($event.target).value)"
            />
          </div>

          <div>
            <label class="block text-[11px] text-slate-500 mb-1" i18n="@@charts.customRange.to">
              To
            </label>
            <input
              type="date"
              class="h-9 w-full rounded-xl border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none"
              [value]="to ?? ''"
              (change)="onToChange($any($event.target).value)"
            />
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between">
          <button
            type="button"
            class="text-xs text-slate-500 hover:text-slate-700"
            (click)="clearRange()"
            i18n="@@charts.customRange.clear"
          >
            Clear
          </button>

          <div class="flex items-center gap-2">
            <button
              type="button"
              class="h-9 px-3 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 hover:bg-slate-50 transition"
              (click)="pickerOpen = false"
              i18n="@@common.cancel2"
            >
              Cancel
            </button>

            <button
              type="button"
              class="h-9 px-3 rounded-xl bg-teal-600 text-xs text-white hover:brightness-110 transition"
              (click)="applyRange()"
              i18n="@@common.apply"
            >
              Apply
            </button>
          </div>
        </div>

        <div class="mt-3 text-[11px] text-slate-400" *ngIf="from || to">
          <span i18n="@@charts.customRange.selected">Selected:</span>
          <span class="ml-1">{{ from || '—' }} → {{ to || '—' }}</span>
        </div>
      </div>
    </div>

    <!-- Total spent -->
    <div class="text-right">
      <div
        class="text-[10px] font-semibold tracking-wide text-slate-400"
        i18n="@@charts.totalSpent"
      >
        TOTAL SPENT
      </div>
      <div class="text-lg font-semibold text-rose-500">
        {{ formatMoney(totalSpent) }}
      </div>
    </div>
  </div>
</div>
