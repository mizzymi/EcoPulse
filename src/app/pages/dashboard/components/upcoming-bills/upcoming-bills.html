<div class="rounded-2xl bg-white border border-slate-100 shadow-sm p-3">
  <div class="flex items-center justify-between">
    <div class="text-sm font-semibold text-slate-800">{{ header }}</div>
    <button type="button" class="text-xs font-semibold text-teal-700 hover:text-teal-800">
      {{ actionText }}
    </button>
  </div>

  <div class="mt-4 space-y-3">
    <div
      *ngFor="let b of bills"
      class="flex items-center justify-between gap-4 rounded-xl border border-slate-100 p-4 hover:bg-slate-50 transition"
    >
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-10 w-10 rounded-xl bg-white border border-slate-100 grid place-items-center">
          <lucide-angular
            *ngIf="b.icon; else emptyIcon"
            class="h-[18px] w-[18px] text-slate-700"
            [img]="b.icon"
          />
          <ng-template #emptyIcon>
            <div class="h-[18px] w-[18px]"></div>
          </ng-template>
        </div>

        <div class="min-w-0">
          <div class="text-sm font-semibold text-slate-800 truncate">{{ b.title }}</div>
          <div class="text-xs text-slate-500 truncate">{{ b.subtitle }}</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span
          *ngIf="b.tag"
          class="text-[11px] px-2 py-1 rounded-full bg-slate-100 text-slate-600 font-medium"
        >
          {{ b.tag }}
        </span>
        <div class="text-sm font-semibold text-slate-800">
          {{ formatAmount(b.amount) }}
        </div>
      </div>
    </div>
  </div>
</div>
