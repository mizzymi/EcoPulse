<div class="w-full mt-3">
  <label class="mb-2 block text-sm font-semibold text-slate-700" [attr.for]="id()">
    {{ label() }}
  </label>

  <div
    class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm transition focus-within:border-teal-500 focus-within:ring-4 focus-within:ring-teal-100"
    [class.opacity-60]="disabled"
  >
    <!-- Left icon -->
    <div class="shrink-0 text-slate-400">
      @if (leadingIcon()) {
        <lucide-angular class="h-[18px] w-[18px]" [img]="leadingIcon()!" />
      } @else {
        <span class="block h-[18px] w-[18px]"></span>
      }
    </div>

    <!-- Input -->
    <input
      class="w-full bg-transparent text-slate-900 placeholder:text-slate-400 outline-none"
      [id]="id()"
      [type]="actualType()"
      [placeholder]="placeholder()"
      [disabled]="disabled"
      [value]="value"
      (input)="handleInput($any($event.target).value)"
      (blur)="handleBlur()"
    />

    <!-- Right eye toggle -->
    @if (showPasswordToggle() && inputType() === 'password') {
      <button
        type="button"
        class="shrink-0 text-slate-400 hover:text-slate-600 transition"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
      >
        <lucide-angular
          class="h-[18px] w-[18px]"
          [img]="isPasswordVisible() ? eyeOffIcon : eyeIcon"
        />
      </button>
    }
  </div>
</div>
