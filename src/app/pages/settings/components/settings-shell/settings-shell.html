<div class="w-full max-w-[1100px] mx-auto pt-4">
  <app-household-summary-card />

  <div class="mt-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-8">
      <app-settings-tabs />
    </div>

    <div class="lg:col-span-4">
      <app-management-actions />
    </div>
  </div>

  <!-- State helpers -->
  <div class="mt-4" *ngIf="isLoading()">
    <div class="rounded-2xl border border-slate-200 bg-white p-4 text-slate-500" i18n>
      Loading settings...
    </div>
  </div>

  <div class="mt-4" *ngIf="isError()">
    <div class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-rose-700">
      <span i18n>Error:</span>
      <span class="ml-2">{{ data.error() }}</span>
    </div>
  </div>
</div>
