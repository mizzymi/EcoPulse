<div class="grid grid-cols-1 xl:grid-cols-3 gap-5">
  <section class="xl:col-span-2">
    <div class="flex items-start justify-between gap-4 mb-4">
      <div>
        <h1 class="text-xl font-semibold text-slate-900" i18n="@@savings.title">Financial Goals</h1>
        <p class="text-sm text-slate-500" i18n="@@savings.subtitle">Track progress towards your targets</p>
      </div>

      <button
        type="button"
        class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-teal-600 text-white text-sm font-medium shadow-sm hover:bg-teal-700 active:bg-teal-800"
        (click)="facade.refresh()"
        aria-label="Refresh goals"
        i18n-aria-label="@@savings.refreshAria"
        i18n="@@savings.refreshBtn"
      >
        <span class="text-base leading-none" aria-hidden="true">↻</span>
        <span>Refresh</span>
      </button>
    </div>

    <app-goals-grid />
  </section>

  <aside class="xl:col-span-1">
    <app-goal-form />
  </aside>
</div>
