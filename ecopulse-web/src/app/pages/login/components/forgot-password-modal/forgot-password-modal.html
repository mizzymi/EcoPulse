<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  (mousedown)="onBackdropClick($event)"
>
  <!-- Dialog -->
  <div
    class="w-full max-w-md rounded-2xl bg-white p-6 shadow-[0_30px_80px_rgba(0,0,0,0.25)]"
    role="dialog"
    aria-modal="true"
    aria-label="Forgot password"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-extrabold text-slate-900" i18n>Forgot password</h2>
        <p class="mt-1 text-sm text-slate-500" i18n>
          Enter your email and we’ll send you a recovery link/code.
        </p>
      </div>

      <button
        type="button"
        class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        (click)="close.emit()"
        aria-label="Close"
      >
        ✕
      </button>
    </div>

    <form class="mt-5 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700" for="fp-email" i18n>
          Email
        </label>

        <input
          id="fp-email"
          type="email"
          formControlName="email"
          placeholder="name@example.com"
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-teal-500 focus:ring-4 focus:ring-teal-100"
        />

        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-2 text-sm text-rose-600" i18n>Please enter a valid email.</p>
        }
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          class="flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 font-bold text-slate-900 hover:bg-slate-50"
          (click)="close.emit()"
          i18n
        >
          Cancel
        </button>

        <button
          type="submit"
          class="flex-1 rounded-xl bg-teal-700 px-4 py-3 font-bold text-white shadow-[0_12px_28px_rgba(16,185,129,0.22)] hover:-translate-y-[1px] transition"
          i18n
        >
          Send
        </button>
      </div>
    </form>
  </div>
</div>
