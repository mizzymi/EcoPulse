<div
  class="rounded-3xl border border-slate-200 bg-white p-6 min-h-[260px] flex items-center justify-center"
>
  <div class="w-full max-w-md text-center">
    <div
      class="mx-auto mb-3 h-12 w-12 rounded-full bg-emerald-100 flex items-center justify-center"
    >
      <span class="text-emerald-700 text-xl">🛡️</span>
    </div>

    <div class="text-lg font-semibold text-slate-900" i18n="@@settings_active_invite_title">
      Active Invite Code
    </div>

    <div class="mt-1 text-sm text-slate-500" i18n="@@settings_active_invite_desc">
      Share this code with trusted people to give them access to this account.
    </div>

    <div class="mt-5 flex items-center justify-center gap-2">
      <div
        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-lg font-semibold tracking-widest text-slate-900 shadow-sm tabular-nums"
      >
        {{ code() || '—' }}
      </div>

      <button
        type="button"
        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition"
        (click)="copy()"
        [disabled]="!code()"
        i18n="@@settings_copy"
      >
        Copy
      </button>
    </div>

    <div class="mt-3 text-xs text-slate-400">
      <span i18n="@@settings_expires_prefix">Expires</span>
      <span *ngIf="expiresAt(); else noexp" class="ml-1">{{ expiresAt() }}</span>
      <ng-template #noexp
        ><span class="ml-1" i18n="@@settings_expires_unknown">in 7 days</span></ng-template
      >
    </div>
  </div>
</div>
