<div class="rounded-2xl bg-white border border-slate-100 shadow-sm p-4 mt-6">
  <div class="font-semibold text-slate-900" i18n="@@savingId.editTitle">Edit goal</div>

  <form class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="block">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savings.form.nameLabel">Goal name</div>
      <input
        type="text"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="name"
      />
    </label>

    <label class="block">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savings.form.targetLabel">Target amount</div>
      <input
        type="number"
        step="0.01"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="target"
      />
    </label>

    <label class="block">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savings.form.deadlineLabel">Deadline</div>
      <input
        type="date"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="deadline"
      />
    </label>

    <div class="md:col-span-3 flex items-center justify-between gap-3 mt-2">
      <button
        type="submit"
        class="px-4 py-2 rounded-xl bg-teal-600 text-white font-medium hover:bg-teal-700 disabled:opacity-60"
        [disabled]="busy"
        i18n="@@common.save"
      >
        Save
      </button>

      <button
        type="button"
        class="px-4 py-2 rounded-xl bg-red-50 text-red-700 font-medium hover:bg-red-100 border border-red-100 disabled:opacity-60"
        (click)="delete.emit()"
        [disabled]="busy"
        i18n="@@common.delete"
      >Delete</button>
    </div>
  </form>
</div>
