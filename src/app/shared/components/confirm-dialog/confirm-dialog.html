<ng-container *ngIf="vm().open">
  <!-- Backdrop -->
  <div class="fixed inset-0 z-[3000] bg-black/30 backdrop-blur-[2px]" (click)="svc.cancel()"></div>

  <!-- Wrapper -->
  <div class="fixed inset-0 z-[3001] flex items-center justify-center p-4">
    <!-- Dialog -->
    <div
      class="w-full max-w-md rounded-3xl bg-white shadow-xl border border-slate-100 overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div class="p-6">
        <!-- Header -->
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-start gap-3">
            <div
              class="h-10 w-10 rounded-2xl flex items-center justify-center"
              [ngClass]="
                vm().tone === 'danger' ? 'bg-rose-50 text-rose-600' : 'bg-slate-50 text-slate-700'
              "
            >
              <lucide-angular [img]="alert"></lucide-angular>
            </div>

            <div class="min-w-0">
              <div class="text-lg font-black text-slate-900">
                {{ vm().title }}
              </div>
              <div class="mt-1 text-sm font-semibold text-slate-600">
                {{ vm().message }}
              </div>
            </div>
          </div>

          <button
            type="button"
            class="rounded-2xl p-2 hover:bg-slate-50 text-slate-500"
            (click)="svc.cancel()"
            aria-label="Close"
          >
            <lucide-angular [img]="x"></lucide-angular>
          </button>
        </div>

        <!-- Footer -->
        <div class="mt-6 flex items-center justify-end gap-3">
          <button
            type="button"
            class="rounded-2xl px-5 py-3 text-sm font-extrabold text-slate-600 hover:bg-slate-50"
            (click)="svc.cancel()"
          >
            {{ vm().cancelText }}
          </button>

          <button
            type="button"
            class="rounded-2xl px-5 py-3 text-sm font-extrabold text-white disabled:opacity-50"
            [ngClass]="
              vm().tone === 'danger'
                ? 'bg-rose-600 hover:bg-rose-700'
                : 'bg-slate-900 hover:bg-slate-800'
            "
            (click)="svc.accept()"
          >
            {{ vm().confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
