@if (isSmall()) {
  <a
    #rla="routerLinkActive"
    class="relative flex w-full flex-col items-center justify-center gap-1 rounded-2xl py-2 text-slate-400 transition"
    [routerLink]="link()"
    routerLinkActive="text-teal-700"
    [routerLinkActiveOptions]="{ exact: true }"
    aria-label="{{ name() }}"
  >
    <lucide-icon class="h-7 w-7" [img]="icon()" color="currentColor"></lucide-icon>
    <span class="text-sm font-medium leading-none">{{ name() }}</span>

    <span
      class="mt-1 h-2 w-2 rounded-full bg-teal-700 transition"
      [class.opacity-100]="rla.isActive"
      [class.opacity-0]="!rla.isActive"
    ></span>
  </a>
}
@if (isBig()) {
  <a
    class="group flex items-center gap-3 rounded-2xl px-4 py-3 text-slate-600 transition hover:bg-slate-50"
    [routerLink]="link()"
    routerLinkActive="bg-teal-600/80 text-white shadow-lg shadow-teal-600/30 hover:bg-teal-600"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <lucide-icon class="h-5 w-5" [img]="icon()"></lucide-icon>
    <span class="text-[15px] font-medium">{{ name() }}</span>
  </a>
}
