@if (!isSmall()) {
  <div
    class="relative p-7 sm:p-10 lg:p-12"
    style="
      background:
        radial-gradient(700px 420px at 20% 20%, rgba(16, 185, 129, 0.14), transparent 60%),
        radial-gradient(700px 420px at 85% 25%, rgba(34, 211, 238, 0.16), transparent 60%),
        linear-gradient(135deg, #f7fbff 0%, #f2fff9 100%);
    "
  >
    <div class="relative mx-auto h-[420px] max-w-[480px]">
      <div
        class="absolute left-1/2 top-8 w-[260px] -translate-x-1/2 rotate-[-6deg] rounded-2xl border border-slate-200/80 bg-white/90 p-4 shadow-[0_18px_40px_rgba(15,23,42,0.12)] backdrop-blur"
      >
        <div class="text-[10px] uppercase tracking-wide text-slate-400" i18n>Total Balance</div>
        <div class="mt-1 text-xl font-extrabold text-slate-900">$12,450.00</div>

        <div class="mt-2 h-1 w-full overflow-hidden rounded-full bg-slate-100">
          <div class="h-full w-2/3 rounded-full bg-emerald-500"></div>
        </div>

        <div class="mt-3 flex items-center justify-end gap-2">
          <span class="inline-flex h-6 items-center gap-2 rounded-full bg-emerald-50 px-2">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            <span class="text-[11px] font-semibold text-emerald-700">+2.4%</span>
          </span>
        </div>
      </div>
      <div
        class="absolute left-1/2 top-1/2 w-[360px] -translate-x-1/2 -translate-y-1/2 rounded-[18px] border border-slate-200/90 bg-white/90 p-4 shadow-[0_18px_40px_rgba(15,23,42,0.12)] backdrop-blur"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-full bg-slate-200"></div>
            <div class="leading-tight">
              <div class="text-sm font-semibold text-slate-800" i18n>Hello, Alex</div>
              <div class="text-xs text-slate-400" i18n>Welcome back</div>
            </div>
          </div>
          <div class="h-9 w-9 rounded-full bg-slate-100"></div>
        </div>
        <div class="mt-4 rounded-xl bg-slate-50 p-4">
          <div class="flex items-end gap-3">
            <div class="h-12 w-8 rounded-md bg-emerald-200"></div>
            <div class="h-16 w-8 rounded-md bg-emerald-300"></div>
            <div class="h-14 w-8 rounded-md bg-emerald-400"></div>
            <div class="h-20 w-8 rounded-md bg-emerald-500"></div>
            <div class="h-18 w-8 rounded-md bg-emerald-600"></div>
            <div class="h-15 w-8 rounded-md bg-emerald-300"></div>
          </div>
        </div>
        <div class="mt-4 space-y-3">
          <div class="flex items-center gap-3 rounded-xl bg-white px-3 py-3 shadow-sm">
            <div class="h-10 w-10 rounded-xl bg-orange-100"></div>
            <div class="min-w-0">
              <div class="text-sm font-semibold text-slate-800" i18n>Restaurant</div>
              <div class="text-xs text-slate-400" i18n>Food & Dining</div>
            </div>
            <div class="ml-auto text-sm font-extrabold text-rose-500">-$45.00</div>
          </div>

          <div class="flex items-center gap-3 rounded-xl bg-white px-3 py-3 shadow-sm">
            <div class="h-10 w-10 rounded-xl bg-blue-100"></div>
            <div class="min-w-0">
              <div class="text-sm font-semibold text-slate-800" i18n>Salary</div>
              <div class="text-xs text-slate-400" i18n>Income</div>
            </div>
            <div class="ml-auto text-sm font-extrabold text-emerald-600">+$3,200.00</div>
          </div>
        </div>
        <div
          class="absolute -bottom-6 right-6 grid h-12 w-12 place-items-center rounded-full bg-emerald-700 text-white shadow-[0_18px_40px_rgba(15,23,42,0.18)]"
          aria-hidden="true"
        >
          +
        </div>
      </div>
      <div
        class="absolute bottom-12 left-6 w-[240px] rotate-[6deg] rounded-2xl border border-slate-200/80 bg-white/90 p-3 shadow-[0_18px_40px_rgba(15,23,42,0.12)] backdrop-blur"
      >
        <div class="flex items-center gap-2">
          <div class="flex -space-x-2">
            <span class="h-7 w-7 rounded-full bg-slate-200 ring-2 ring-white"></span>
            <span class="h-7 w-7 rounded-full bg-slate-300 ring-2 ring-white"></span>
            <span class="h-7 w-7 rounded-full bg-slate-400 ring-2 ring-white"></span>
          </div>
          <div class="leading-tight">
            <div class="text-xs font-semibold text-slate-800" i18n>Home Rent</div>
            <div class="text-[11px] text-slate-400" i18n>Shared Account</div>
          </div>
          <div class="ml-auto text-xs font-extrabold text-slate-700">+2</div>
        </div>
      </div>
    </div>
  </div>
}
