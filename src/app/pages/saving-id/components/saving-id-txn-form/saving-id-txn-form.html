<div class="rounded-2xl bg-white border border-slate-100 shadow-sm p-4">
  <div class="font-semibold text-slate-900" i18n="@@savingId.addTxnTitle">Add transaction</div>

  <form class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="block">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savingId.txnType">Type</div>
      <select
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="type"
      >
        <option value="DEPOSIT">Deposit</option>
        <option value="WITHDRAWAL">Withdrawal</option>
      </select>
    </label>

    <label class="block">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savingId.txnAmount">Amount</div>
      <input
        type="number"
        step="0.01"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="amount"
      />
    </label>

    <label class="block md:col-span-2">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savingId.txnNote">Note</div>
      <input
        type="text"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="note"
        placeholder="Optional"
      />
    </label>

    <label class="block md:col-span-2">
      <div class="text-xs text-slate-500 mb-1" i18n="@@savingId.txnDate">Date</div>
      <input
        type="date"
        class="w-full rounded-xl border border-slate-200 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-teal-200"
        formControlName="occursAt"
      />
    </label>

    <div class="md:col-span-4 flex justify-end">
      <button
        type="submit"
        class="px-4 py-2 rounded-xl bg-slate-900 text-white font-medium hover:bg-black disabled:opacity-60"
        [disabled]="busy"
        i18n="@@common.add"
      >
        Add
      </button>
    </div>
  </form>
</div>
