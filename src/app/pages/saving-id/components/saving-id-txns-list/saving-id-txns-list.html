<div class="rounded-2xl bg-white border border-slate-100 shadow-sm p-4 overflow-auto max-h-full">
  <div class="flex items-center justify-between gap-2">
    <div class="font-semibold text-slate-900" i18n="@@savingId.txnsTitle">Transactions</div>
  </div>

  <div *ngIf="loading" class="text-sm text-slate-500 py-10 text-center" i18n="@@common.loading">Loading...</div>

  <div
    *ngIf="!loading && rows.length === 0"
    class="text-sm text-slate-500 py-10 text-center"
    i18n="@@savingId.noTxns"
  >
    No transactions yet.
  </div>

  <div class="mt-3 space-y-2" *ngIf="!loading && rows.length > 0">
    <div
      *ngFor="let t of rows; trackBy: track"
      class="flex items-center justify-between gap-3 rounded-xl border border-slate-100 bg-slate-50 px-3 py-2"
    >
      <div class="min-w-0">
        <div class="text-sm font-medium text-slate-900">
          {{ t.type }} · {{ t.amount | number: '1.0-2' }}
        </div>
        <div class="text-xs text-slate-500 truncate">{{ t.note || '—' }}</div>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-xs text-slate-500">
          {{ t.occursAt ? (t.occursAt | date: 'mediumDate') : '' }}
        </div>

        <button
          type="button"
          class="text-xs font-medium text-slate-500 hover:text-red-600 px-2 py-1 rounded-lg hover:bg-red-50 disabled:opacity-60"
          (click)="onDelete($event, t)"
          [disabled]="busy"
          aria-label="Delete transaction"
          i18n-aria-label="@@savingId.txn.deleteAria"
          i18n="@@common.delete"
        >Delete</button>
      </div>
    </div>
  </div>
</div>
